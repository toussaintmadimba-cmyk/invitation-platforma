{% extends "partials/_base.html" %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 520px;">
  <div class="card-body p-4">
    <h3>Nouveau mot de passe</h3>
    {% if valid %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="new-password">Mot de passe (8 caractères minimum)</label>
      <input id="new-password" class="form-control mb-3" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="256" required>
      <label class="form-label" for="confirm-password">Confirmer le mot de passe</label>
      <input id="confirm-password" class="form-control mb-3" type="password" name="password_confirm" autocomplete="new-password" minlength="8" maxlength="256" required>
      <button class="btn btn-gold w-100" type="submit">Enregistrer le mot de passe</button>
    </form>
    {% else %}
    <p>Ce lien est invalide, a expiré ou a déjà été utilisé.</p>
    <a class="btn btn-gold" href="{{ url_for('auth.forgot_password') }}">Demander un nouveau lien</a>
    {% endif %}
  </div>
</div>
{% endblock %}
