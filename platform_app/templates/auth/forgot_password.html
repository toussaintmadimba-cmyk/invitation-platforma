{% extends "partials/_base.html" %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 520px;">
  <div class="card-body p-4">
    <h3>Mot de passe oublié</h3>
    <p class="text-muted">Indiquez l'email de votre compte pour recevoir un lien de réinitialisation.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="reset-email">Email</label>
      <input id="reset-email" class="form-control mb-3" type="email" name="email" autocomplete="email" maxlength="255" required>
      <button class="btn btn-gold w-100" type="submit">Recevoir le lien</button>
    </form>
    <a class="d-inline-block mt-3" href="{{ url_for('auth.login_get') }}">Retour à la connexion</a>
  </div>
</div>
{% endblock %}
